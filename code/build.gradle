plugins {
    id 'java'
    id 'maven-publish'
    id 'com.enonic.xp.app'
    id "com.github.node-gradle.node" version "7.0.0"
    id 'org.ajoberstar.grgit' version '4.1.1'
    id "com.github.ben-manes.versions" version '0.47.0'
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = "${group}"
            artifactId = "${projectName}"
            version = "${version}"

            from components.java
        }
    }
}

ext {
    deployDir = "../deploy/"
}

sourceSets {
    main {
        resources {
            srcDir 'site'
        }
    }
}

tasks.named("jar") {
    dependsOn(":npmBuild")
}

task packageApplication {
    dependsOn(':build')
    group 'application'
    description 'Packages entire application'
    doLast {
        copy {
            from "build/libs/${projectName}-${version}.jar"
            into "${deployDir}"
            rename ("${projectName}-${version}.jar", "${projectName}.jar")
        }
    }
}

task frontend {
    dependsOn(':frontend:build')
    inputs.dir 'src/frontend/'
    outputs.dir "$buildDir/resources/main"
}

task npmBuild(
        type: NpmTask,
        group: 'node',
        dependsOn: 'npmLint',
        description: 'Build javascript'
) {
    inputs.dir 'src'
    outputs.dir "$buildDir/resources"
    args = ['run', 'build']
}
rootProject.tasks.getByName('build').dependsOn npmBuild

task npmDev(
        type: NpmTask,
        group: 'node',
        dependsOn: 'installWithCI',
        description: 'Build and watch backend and frontend resources'
    ) {
    args = ['run', 'dev']
}

task npmTest(
        type: NpmTask,
        group: 'node',
        dependsOn: 'npmBuild',
        description: 'Run javascript tests'
    ) {
    inputs.dir 'src'
    outputs.dir "$buildDir/test-results"
    args = ['run', 'test']
}
rootProject.tasks.getByName("test").dependsOn npmTest

task npmLint(
        type: NpmTask,
        group: 'node',
        dependsOn: ['installWithCI', 'frontend'],
        description: 'Run lint'
) {
    inputs.dir 'src/main'
    outputs.dir "$buildDir/lint-results"
    args = ['run', 'lint']
}

task npmWatch(
        type: NpmTask,
        group: 'node',
        dependsOn: 'npmBuild',
        description: 'Run watch'
) {
    args = ['run', 'watch']
}

task installWithCI(
        type: NpmTask,
        group: 'node',
        description: 'Install node dependencies with ci, ignoring scripts'
) {
    inputs.files "package.json"
    outputs.dir "./node_modules"
    args = ['ci', '--ignore-scripts', '--quiet']
}

task npm_install(
        type: NpmTask,
        group: 'node',
        description: 'Install node dependencies, ignoring scripts'
) {
    args = ['install', '--ignore-scripts', '--quiet']
}

task appName {
    group 'application'
    description 'Get the name of the application from gradle.properties'
    doLast {
        print "${projectName}".replaceAll(/[^a-zA-Z]/, "");
    }
}

task appVersion {
    group 'application'
    description 'Get the version of the application from gradle.properties'
    doLast {
        print "${version}"
    }
}

task enonicVersion {
    group 'application'
    description 'Get the enonic XP version from gradle.properties'
    doLast {
        print "${xpVersion}"
    }
}

dependencies {
    implementation xplibs.api.core
    implementation xplibs.api.portal
    include xplibs.admin
    include xplibs.auth
    include xplibs.content
    include xplibs.context
    include xplibs.i18n
    include xplibs.io
    include xplibs.portal
    include xplibs.repo
    include xplibs.node
    include xplibs.event
    // TODO XP8: xp-lib-freemarker 2.0.3 is XP7-only (no XP 8 build). Bump to an XP8 release or drop when the templating engine is replaced.
    include 'com.github.tineikt:xp-lib-freemarker:2.0.3'
}

repositories {
    mavenLocal()
    mavenCentral()
    xp.enonicRepo()
    maven { url 'https://jitpack.io' }
}

node {
    // Version of node to use.
    version = '16.15.1'

    // Version of npm to use.
    npmVersion = '8.11.0'

    // If true, it will download node using above parameters.
    // If false, it will try to use globally installed node.
    download = true
}

wrapper {
    gradleVersion = '9.5.0'
    distributionType = Wrapper.DistributionType.BIN
}
